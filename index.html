:root{--t:#0F746C;--d:#0A524C;--q:#40ABB5;--soft:#E0F0EE;--ink:#0F2B29;--m:#5C7471;--l:#D5E0DE;--bg:#F1F6F5;--r:#AC3B34}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
[hidden]{display:none!important}button,input,select{font:inherit}a{color:var(--t)}
.btn{background:var(--t);color:#fff;border:0;border-radius:8px;padding:9px 20px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.btn:hover{background:var(--d)}.btn:disabled{opacity:.6;cursor:wait}
.btn.sec{background:#fff;color:var(--t);border:1px solid var(--l)}.btn.sec:hover{border-color:var(--t);background:var(--soft)}.btn.dg{background:#fff;color:var(--r);border:1px solid #e3b3b0}.btn.sm{padding:3px 12px;font-size:.85rem}
input,select{width:100%;padding:10px 12px;border:1px solid var(--l);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--q);outline-offset:1px}

async function setup(){const e=$('#se'),b=$('#sb');e.textContent='';try{const n=$('#an').value.trim().toLowerCase(),p=$('#ap').value,fs=[...$('#af').files];if(!/^[a-z0-9._-]{2,30}$/.test(n))throw Error('نام کاربری مدیر: فقط حروف انگلیسی، عدد و . _ - (۲ تا ۳۰ نویسه)');const pe=pwErr(p,true);if(pe)throw Error(pe);if(!fs.length)throw Error('فایل‌های ابزار را انتخاب کن.');
b.disabled=true;b.textContent='در حال ساخت… چند ثانیه صبر کن';S={order:[],tools:{},users:{},cats:CORD.map((n,i)=>({n,col:PAL[i]})),pub:'',pend:{},groups:[],news:[],chat:'',dirty:false,rot:false};
for(const f of fs){const k=f.name.replace(/\s*\(\d+\)(?=\.html$)|_\d+_(?=\.html$)/,'').replace(/\s+/g,'-'),by=new Uint8Array(await f.arrayBuffer()),m=META[k]||[(D.decode(by.subarray(0,20000)).match(/<title>(.*?)<\/title>/s)||[0,k])[1].trim(),'','سایر','doc'];S.order.push(k);S.tools[k]={t:m[0],d:m[1],c:m[2],i:m[3],g:'',bytes:by}}
const ks=Object.keys(META);S.order.sort((a,b)=>{const x=ks.indexOf(a),y=ks.indexOf(b);return(x<0?99:x)-(y<0?99:y)});const id=await uid(n);ME=id;S.users[id]={n,dn:$('#ad').value.trim(),role:'admin',tools:[],U:b64(rnd(32)),pw:p};
const{nv,files}=await build();await dlAll(nv,files);$('.box').innerHTML='<h2 style="margin:0">vault.json ساخته شد</h2><ol><li>فایل‌های دانلودشده (vault.json و چند فایل t-….bin) را همه با هم در ریپوی گیت‌هاب، کنار index.html (همین صفحه) آپلود کن (Add file ← Upload files ← Commit changes).</li><li>یکی دو دقیقه بعد، آدرس سایت را باز کن و با همین نام کاربری و رمز وارد شو. بقیه‌ی کاربران را از «تنظیمات» اضافه کن.</li></ol>'}catch(x){b.disabled=false;b.textContent='ساخت vault.json';e.textContent=x.message}}
/* ---------- boot ---------- */
function route(){if(!B){vLogin();return}TV.hidden=true;let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch{}if(h.startsWith('t='))vTool(h.slice(2));else if(h=='admin')vAdmin();else vPortal()}
addEventListener('hashchange',()=>B&&route());addEventListener('beforeunload',e=>{if(S&&S.dirty){e.preventDefault();e.returnValue=''}});
addEventListener('keydown',e=>{if(!B)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();pal();return}if(e.key=='/'&&$('#q')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
const isFile=location.protocol=='file:';
VP=isFile?Promise.reject('file'):fetch('vault.json?t='+Date.now(),{cache:'no-store'}).then(async r=>{if(r.status==404)throw 404;if(!r.ok)throw r.status;V=await r.json()});VP.catch(()=>{});
(async()=>{if(isFile||location.hash=='#setup'){spOff(1);vSetup();return}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const t0=Date.now();app.innerHTML=bar()+'<main class="wrap"><div class="pb"><i></i></div><p class="empty">در حال آماده‌سازی…</p></main>';
try{await VP}catch(x){spOff(1);app.innerHTML=bar()+`<main class="wrap"><p class="empty">${x==404?'سامانه هنوز راه‌اندازی نشده است. اگر مدیر هستی، با افزودن #setup به انتهای آدرس راه‌اندازی را شروع کن.':'دریافت اطلاعات سامانه ممکن نشد. اینترنت را بررسی کن و صفحه را دوباره باز کن.'}</p></main>`;return}
await spOff(t0);const s=ST.s;if(s){try{const o=JSON.parse(s);await enter(o.id,u8(o.uk));return}catch(x){ST.clear()}}vLogin()})();
</script></body></html>
